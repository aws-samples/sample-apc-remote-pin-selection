# DynamoDB Local for the pinstore integration test. Not used by the demo itself.
#
#   docker compose -f docker-compose.local.yaml up -d
#   cd backend && DYNAMODB_ENDPOINT=http://localhost:8000 go test ./pinstore/
services:
  dynamodb:
    image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:2.6.1
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.local/dynamodb:/data

  dynamodb-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.27.41
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name remote-pin-demo-verifiers \
          --attribute-definitions AttributeName=pan,AttributeType=S \
          --key-schema AttributeName=pan,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
