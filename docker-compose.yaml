# Runs the demo against the AWS resources created in the README setup steps.
#
#   backend   Go issuer backend on http://localhost:8080. Reads backend/.env and
#             uses your host AWS credentials (~/.aws, mounted read-only).
#   frontend  Flutter web app served by Apache on http://localhost:8081.
#
# Use AWS_PROFILE=<name> docker compose up --build for a non-default profile.
services:
  backend:
    build:
      context: ./backend
      args:
        GOPROXY: direct
    env_file:
      - ./backend/.env
    environment:
      # All interfaces inside the container; the published port below is
      # loopback-only.
      BACKEND_ADDR: ":8080"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081},http://127.0.0.1:${FRONTEND_PORT:-8081}}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "1"
      HOME: /root
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - "${HOME}/.aws:/root/.aws:ro"
    container_name: remote-pin-backend

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: "${FRONTEND_API_BASE_URL:-http://localhost:8080}"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    container_name: remote-pin-frontend
