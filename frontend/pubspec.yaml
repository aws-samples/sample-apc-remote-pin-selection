name: remote_pin_selection_demo
description: Flutter web client for the remote PIN selection demo (AWS Private CA and AWS Payment Cryptography).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  pointycastle: ^3.9.1
  asn1lib: ^1.5.0
  basic_utils: ^5.7.0
  http: ^1.2.0
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
